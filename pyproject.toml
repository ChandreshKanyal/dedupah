[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupe"
version = "0.1.0"
description = "Customer data deduplication and golden-record platform"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2",
    "pydantic-settings>=2",
    "openpyxl>=3.1",
    "sqlalchemy>=2",
    "numpy>=1.26",
    "psutil>=5.9",                               # peak-memory figures in the pipeline and benchmark
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
# Source connectors (each optional; the connection screen says which one a source needs when it is missing)
files = ["xlrd>=2.0", "fastavro>=1.9", "defusedxml>=0.7"]
sqlserver = ["pyodbc>=5.1"]                      # plus Microsoft ODBC Driver 18 for SQL Server on the server; or pymssql>=2.3
oracle = ["oracledb>=2.0"]
db2 = ["ibm_db_sa>=0.4"]
redshift = ["sqlalchemy-redshift>=0.8", "redshift_connector>=2.1"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
bigquery = ["sqlalchemy-bigquery>=1.11"]
databricks = ["databricks-sqlalchemy>=2.0"]
mongodb = ["pymongo>=4.6"]
sftp = ["paramiko>=3.4"]
connectors = ["dedupe[postgres,mysql,files,oracle,mongodb,sftp]"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pyjwt[crypto]>=2.8", "tzdata>=2024.1; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "bandit>=1.7", "pip-audit>=2.7", "cyclonedx-bom>=4",
       # stand-ins for connector tests: a real PostgreSQL, an S3 API server, an in-memory MongoDB, an .xls writer
       "pgserver>=0.1.4", "moto[server]>=5.0", "mongomock>=4.1", "xlwt>=1.3", "pymssql>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dedupe.api" = ["ui/*", "ui/logos/*", "ui/landing/*", "ui/landing/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741"]  # long SQL/f-string lines are deliberate; l/r are conventional names for left/right

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B608 (SQL built with f-strings) was audited on 2026-10-06 and skipped: every f-string SQL in this code base interpolates (a) constants and column
# lists written in the code, (b) file paths chosen by the server, (c) values passed through the quoting helpers in dedupe.mapping.config, or (d) conditions
# compiled from the rule language, which only accepts known comparison names, level labels and numbers. Values that arrive from a caller are bound
# as query parameters. tests/test_connector_security.py and tests/test_governance.py pin these boundaries. Re-audit when adding SQL that
# touches caller input.
# B105 (hard-coded password strings) only matched the column name "aadhaar_token"; real secrets are caught by gitleaks and by the rule that credentials come from the environment.
skips = ["B608", "B105"]
