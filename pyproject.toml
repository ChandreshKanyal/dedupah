[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupe"
version = "0.1.0"
description = "Customer data deduplication and golden-record platform"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2",
    "pydantic-settings>=2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
