[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupe"
version = "0.1.0"
description = "Customer data deduplication and golden-record platform"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2",
    "pydantic-settings>=2",
    "openpyxl>=3.1",
    "sqlalchemy>=2",
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741"]  # long SQL/f-string lines are deliberate; l/r are conventional names for left/right
