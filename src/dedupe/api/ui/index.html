<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurionpro Dedupe</title>
<link rel="icon" type="image/png" href="/ui/favicon.png">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<a id="skip" href="#content">Skip to content</a>
<div id="login">
  <form id="login-form" autocomplete="off">
    <img class="logo" src="/ui/logo-light.png" alt="Aurionpro - Lead the next">
    <h1>Sign in</h1>
    <p id="login-help">Paste your access token. It is kept in this page's memory only and is gone when you close or reload the tab.</p>
    <p id="login-error" class="bad" role="alert" hidden></p>
    <div id="token-fields" class="field">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
    </div>
    <div id="password-fields" hidden>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" spellcheck="false" autocapitalize="none">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
    </div>
    <button id="signin" type="submit" class="primary">Sign in</button>
  </form>
</div>
<div id="app" hidden>
  <header id="topbar">
    <div id="brand"><img src="/ui/wordmark-dark.png" alt="Aurionpro"><span id="product">Dedupe Workspace</span></div>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search projects and runs" aria-label="Search" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <span id="search-hint" aria-hidden="true">Ctrl + K</span>
      <div id="search-results" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div id="account">
      <button id="user-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu"><span id="who"></span></button>
      <div id="user-menu" role="menu" aria-labelledby="user-btn" hidden>
        <div id="menu-who"></div>
        <button id="menu-account" type="button" role="menuitem">My account</button>
        <button id="menu-settings" type="button" role="menuitem">Settings</button>
        <button id="menu-signout" type="button" role="menuitem">Sign out</button>
      </div>
    </div>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="content" tabindex="-1">
    <div id="loading" role="status" aria-live="polite"></div>
    <div id="banner" role="status" aria-live="polite" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay" hidden><div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
<script src="/ui/app.js"></script>
</body>
</html>
