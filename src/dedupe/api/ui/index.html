<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dedupe</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div id="login">
  <form id="login-form" autocomplete="off">
    <h1>Sign in to Dedupe</h1>
    <p>Paste your access token. It is kept in this page's memory only and is gone when you close or reload the tab.</p>
    <p id="login-error" class="bad" role="alert" hidden></p>
    <div class="field">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
    </div>
    <button id="signin" type="submit" class="primary">Sign in</button>
  </form>
</div>
<div id="app" hidden>
  <header id="topbar">
    <div id="brand"><span class="mark">D</span>Dedupe</div>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search projects, runs and connections" aria-label="Search" autocomplete="off">
      <span id="search-hint">Ctrl + K</span>
      <div id="search-results" role="listbox" hidden></div>
    </div>
    <div id="account">
      <button id="theme" class="ghost" aria-label="Switch between dark and light"></button>
      <span id="avatar" aria-hidden="true"></span>
      <span id="who"></span>
      <button id="signout" class="ghost">Sign out</button>
    </div>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="content">
    <div id="banner" role="status" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay" hidden><div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
<script src="/ui/app.js"></script>
</body>
</html>
