<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dedupe</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div id="login">
  <form id="login-form" autocomplete="off">
    <h1>Sign in to Dedupe</h1>
    <p>Paste your access token. It is kept in this page's memory only and is gone when you close or reload the tab.</p>
    <p id="login-error" class="bad" role="alert" hidden></p>
    <div class="field">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
    </div>
    <button id="signin" type="submit" class="primary">Sign in</button>
  </form>
</div>
<div id="app" hidden>
  <header id="topbar">
    <span id="brand">Dedupe</span>
    <div id="account"><span id="who"></span><button id="signout">Sign out</button></div>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="content">
    <div id="banner" role="status" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay" hidden><div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
<script src="/ui/app.js"></script>
</body>
</html>
