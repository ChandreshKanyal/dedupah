<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurionpro Dedupe</title>
<link rel="icon" type="image/png" href="/ui/favicon.png">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<a id="skip" href="#content">Skip to content</a>
<div id="login">
  <form id="login-form" autocomplete="off">
    <img class="logo logo-on-dark" src="/ui/logo-dark.png" alt="Aurionpro - Lead the next">
    <img class="logo logo-on-light" src="/ui/logo-light.png" alt="Aurionpro - Lead the next">
    <h1>Sign in</h1>
    <p id="login-help">Paste your access token. It is kept in this page's memory only and is gone when you close or reload the tab.</p>
    <p id="login-error" class="bad" role="alert" hidden></p>
    <div id="token-fields" class="field">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
    </div>
    <div id="password-fields" hidden>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" spellcheck="false" autocapitalize="none">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
    </div>
    <button id="signin" type="submit" class="primary">Sign in</button>
  </form>
</div>
<div id="app" hidden>
  <header id="topbar">
    <div id="brand"><img class="logo-on-dark" src="/ui/wordmark-dark.png" alt="Aurionpro"><img class="logo-on-light" src="/ui/wordmark-light.png" alt="Aurionpro"></div>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search projects and runs" aria-label="Search" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <span id="search-hint" aria-hidden="true">Ctrl + K</span>
      <div id="search-results" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div id="account">
      <button id="theme" class="ghost" aria-label="Switch between dark and light"></button>
      <span id="avatar" aria-hidden="true"></span>
      <span id="who"></span>
      <button id="password-btn" class="ghost" hidden>Password</button>
      <button id="signout" class="ghost">Sign out</button>
    </div>
  </header>
  <nav id="nav" aria-label="Main"></nav>
  <main id="content" tabindex="-1">
    <div id="loading" role="status" aria-live="polite"></div>
    <div id="banner" role="status" aria-live="polite" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay" hidden><div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
<script src="/ui/app.js"></script>
</body>
</html>
