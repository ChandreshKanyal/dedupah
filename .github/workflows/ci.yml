name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,api,postgres]"
      - run: ruff check src tests
      - run: pytest -q
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}            # secret scan looks at the whole history
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,api,postgres]"
      - name: Static analysis (bandit)
        run: bandit -r src -c pyproject.toml -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable
      - name: Secrets in code and history
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Software bill of materials
        run: cyclonedx-py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom.cdx.json}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t dedupe-api .
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with: {image-ref: dedupe-api, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
